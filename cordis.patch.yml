# dsh-voice — voice input for the DeepSeek Harness Web Client.
#
# The Consumer and its browser surface are always composed; the transcription
# providers are not, because each needs a deployment-specific answer (an
# endpoint and key, or a binary and model file) that no default can supply.
# With neither mounted the composer seat renders nothing at all and the settings
# card says why, so an unconfigured install shows no dead control.
#
# Enable exactly ONE provider row: both claim `ctx.transcription`, and a
# composition mounting both fails loudly at load rather than picking one.
# Override any row from your profile's own cordis.patch.yml by `id`, restating
# every key the row needs — a patch replaces a row's whole `config`.
- insert:
    - id: voice
      name: '@achasoft/dsh-voice/host'
      config:
        maxClipSeconds: 120
        # 25 MiB is the documented per-file ceiling of the hosted Whisper API;
        # the local provider has no ceiling of its own, so this is the binding
        # limit for both and the browser stops recording long before it.
        maxClipBytes: 26214400
        interactionMode: toggle
        insertMode: append
        # Dictation is speech, not prose. The session's own model removes fillers, restores
        # punctuation, and turns spoken enumerations into lists — no second credential involved.
        polish: true
        # Stop when the speaker stops, rather than making them reach for the button. Well above a
        # natural between-sentence pause, so it ends a dictation without truncating one.
        silenceStopMs: 2500
        # Provisional in-progress transcripts are OFF by default: each pass re-transcribes from the
        # beginning, which is cheap against a local binary and billed per pass against a hosted one.
        # Set it (2000 is comfortable) when running the whisper-cpp provider.
        # liveIntervalMs: 2000

    # The BARE package name, deliberately: the Web Client discovers a browser half
    # by resolving `<row name>/package.json`, so a subpath row here would leave the
    # composer seat silently unserved.
    - id: voice-ui
      name: '@achasoft/dsh-voice'

    - id: voice-openai-compatible
      name: '@achasoft/dsh-voice/openai-compatible'
      disabled: true
      config:
        baseUrl: https://api.openai.com/v1
        model: whisper-1
        apiKeyEnv: OPENAI_API_KEY
        timeoutMs: 120000

    - id: voice-whisper-cpp
      name: '@achasoft/dsh-voice/whisper-cpp'
      disabled: true
      config:
        binaryPath: whisper-cli
        modelPath: ''
        timeoutMs: 300000
        maxOutputBytes: 262144
        graceMs: 5000
